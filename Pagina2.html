<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetMatch</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
   
</head>

<body>
    <header>

        <div class="cabecalho">
            <div class="usuario">
            <i class="fa-regular fa-circle-user"></i>
            <P>Nome Da Silva</P>
            </div>
            <nav>
                <div class="inicio">
                    <i class="fa-solid fa-house"></i>
                    <a href="#">INICIO</a>
                </div>

                <div class="entrar" id="link-entrar" >
                    <i class="fa-regular fa-heart"></i>
                    <a href="#">FAVORITOS</a>
                </div>

                <div class="cadastrar" id="link-cadastrar">
                  <i class="fa-solid fa-location-dot"></i>
                    <a href="#">Ongs Perto de mim</a>
                </div>

            </nav>
            <section class="buscar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" name="Busca" id="" placeholder="Buscar">
            </section>
        </div>
    </header>
 <section class="Principal">
    <div class="grupo1">
    <div class="cards">
        <i class="fa-solid fa-paw"></i>
    <P>Quero adotar</P>
    </div>
    <div class="cards">
        <i class="fa-solid fa-users"></i>
    <P>Encontrar Amigos</P>
    </div>
    <div class="cards">
        <i class="fa-solid fa-square-poll-horizontal"></i>
    <P>Feed de noticias</P>
    </div>
    </div>

    <div class="grupo2">
    <div class="cards">
      <i class="fa-solid fa-cat"></i>
    <P>Encontrei Um Pet</P>
    </div>
    <div class="cards">
      <i class="fa-solid fa-handshake"></i>
    <P>Seja um Voluntário</P>
    </div>
    <div class="cards">
        <i class="fa-solid fa-message"></i>
    <P>Fale Conosco</P>
    </div>
    </div>





 </section>

</body>
</html>
